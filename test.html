<script>
(function(){
 var lang='hi';try{lang=localStorage.getItem('nstc_lang')||'hi'}catch(e){}
 var btn=document.getElementById('langBtn');
 function apply(){document.documentElement.lang=lang;
  document.querySelectorAll('[data-en]').forEach(function(el){el.textContent=el.dataset[lang]||el.dataset.en});
  btn.textContent=lang==='en'?'हिंदी':'English';
  var ti=document.body.dataset['title'+(lang==='en'?'En':'Hi')];if(ti)document.title=ti+' | NSTC Classes';}
 btn.addEventListener('click',function(){lang=lang==='en'?'hi':'en';try{localStorage.setItem('nstc_lang',lang)}catch(e){};apply()});
 document.getElementById('year').textContent=new Date().getFullYear();
 var bk=document.getElementById('backLink');
 if(bk)bk.addEventListener('click',function(e){if(history.length>1&&document.referrer&&document.referrer.indexOf(location.host)!==-1){e.preventDefault();history.back();}});
 apply();
})();
</script>

<script>
(function(){
var L=function(){try{return localStorage.getItem('nstc_lang')||'hi'}catch(e){return'hi'}};
var S={hi:{start:'टेस्ट शुरू करें',q:'प्रश्न',of:'में से',next:'अगला प्रश्न',fin:'परिणाम देखें',score:'आपका स्कोर',again:'दोबारा करें',all:'सभी टेस्ट',share:'WhatsApp पर भेजें',none:'इस कक्षा का टेस्ट जल्द आएगा।',cls:'कक्षा',qs:'प्रश्न',good:'बहुत बढ़िया!',mid:'अच्छा प्रयास, थोड़ा और अभ्यास करें।',low:'पाठ दोबारा पढ़कर फिर कोशिश करें।',ex:'व्याख्या: ',all2:'सभी'},
en:{start:'Start test',q:'Question',of:'of',next:'Next question',fin:'See result',score:'Your score',again:'Try again',all:'All tests',share:'Share on WhatsApp',none:'Tests for this class are coming soon.',cls:'Class',qs:'questions',good:'Excellent!',mid:'Good effort, practise a little more.',low:'Revise the chapter and try again.',ex:'Explanation: ',all2:'All'}};
var idx=[],cur='all',app=document.getElementById('tApp'),chips=document.getElementById('tChips');
function s(){return S[L()]}
function T(o,k){return o[k+'_'+L()]||o[k+'_hi']}
function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}
function list(){
 var x=s(),cl=['all'];idx.forEach(function(t){if(cl.indexOf(t['class'])<0)cl.push(t['class'])});
 cl.sort(function(a,b){return a==='all'?-1:b==='all'?1:a-b});
 chips.innerHTML=cl.map(function(c){return '<button class="chip" data-c="'+c+'" style="cursor:pointer;'+(c===cur?'background:#12634b;color:#fff':'')+'">'+(c==='all'?x.all2:x.cls+' '+c)+'</button>'}).join('');
 var f=idx.filter(function(t){return cur==='all'||t['class']===cur});
 app.innerHTML=f.length?'<div class="t-list">'+f.map(function(t){return '<div class="t-item"><div><b>'+esc(T(t,'title'))+'</b><small>'+x.cls+' '+t['class']+' · '+esc(T(t,'subject'))+' · '+t.count+' '+x.qs+'</small></div><button class="btn" data-id="'+t.id+'">'+x.start+'</button></div>'}).join('')+'</div>':'<p>'+x.none+'</p>';
}
chips.addEventListener('click',function(e){var c=e.target.getAttribute&&e.target.getAttribute('data-c');if(c){cur=c;list()}});
app.addEventListener('click',function(e){var id=e.target.getAttribute&&e.target.getAttribute('data-id');if(id)run(id)});
function run(id){
 fetch('tests/'+id+'.json').then(function(r){return r.json()}).then(function(t){
  chips.style.display='none';var i=0,sc=0,x=s();
  function show(){
   var q=t.questions[i];x=s();
   app.innerHTML='<p><b>'+x.q+' '+(i+1)+' '+x.of+' '+t.questions.length+'</b></p><div class="t-prog"><i style="width:'+(i/t.questions.length*100)+'%"></i></div><h2 style="margin-top:0">'+esc(q.q)+'</h2><div id="opts">'+q.o.map(function(o,k){return '<button class="t-opt" data-k="'+k+'">'+esc(o)+'</button>'}).join('')+'</div><div id="fb"></div>';
   var done=false;
   document.getElementById('opts').addEventListener('click',function(e){
    var k=e.target.getAttribute&&e.target.getAttribute('data-k');if(k===null||done)return;done=true;k=+k;
    var bs=this.querySelectorAll('.t-opt');bs[q.a].classList.add('ok');if(k!==q.a)bs[k].classList.add('bad');else sc++;
    document.getElementById('fb').innerHTML='<div class="t-exp">'+x.ex+esc(q.e)+'</div><button class="btn" id="nx">'+(i+1<t.questions.length?x.next:x.fin)+'</button>';
    document.getElementById('nx').onclick=function(){i++;i<t.questions.length?show():end()};
   });
  }
  function end(){
   x=s();var n=t.questions.length,p=sc/n,m=p>=.8?x.good:p>=.5?x.mid:x.low;
   var msg=encodeURIComponent('NSTC Classes टेस्ट: '+t.title_hi+' - मेरा स्कोर '+sc+'/'+n+' '+location.href);
   app.innerHTML='<h2>'+esc(T(t,'title'))+'</h2><p>'+x.score+'</p><div class="t-score">'+sc+' / '+n+'</div><p>'+m+'</p><p><button class="btn" id="ag">'+x.again+'</button><button class="btn alt" id="bk">'+x.all+'</button><a class="btn alt" target="_blank" rel="noopener" href="https://wa.me/?text='+msg+'">'+x.share+'</a></p>';
   document.getElementById('ag').onclick=function(){run(id)};
   document.getElementById('bk').onclick=function(){chips.style.display='';list()};
  }
  show();window.scrollTo(0,0);
 });
}
fetch('tests/index.json').then(function(r){return r.json()}).then(function(d){idx=d;list()});
document.getElementById('langBtn').addEventListener('click',function(){setTimeout(function(){if(!document.getElementById('opts')&&chips.style.display!=='none')list()},0)});
})();
</script>
